[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF -> Markdown pipeline: Unlimited-OCR layout parsing + vision-LLM figure descriptions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "pymupdf==1.28.2",
    "pillow==12.3.0",
    "openai==3.5.0",
    "python-dotenv==1.2.3",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    # Starlette needs it to parse multipart uploads; not a transitive dep.
    "python-multipart==0.0.32",
]

[dependency-groups]
# Streamlit is only needed by `app.py`. Keeping it out of `dependencies` lets the
# API container install with `--no-default-groups` and skip streamlit + pandas +
# pyarrow entirely; `default-groups` below keeps the local workflow unchanged.
ui = ["streamlit==1.62.0"]
# httpx backs fastapi.testclient.
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.uv]
package = false
default-groups = ["dev", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `package = false` means pdf2md is never installed into the venv; make the repo
# root importable so tests and `streamlit run app.py` resolve it the same way.
pythonpath = ["."]
