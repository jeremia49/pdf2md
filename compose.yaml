# docker compose up --build
#
# `.env` is read two ways on purpose:
#   env_file  -> the values land in the container's environment, which is where
#                Settings.from_env() reads them.
#   No bind mount of .env: the file never needs to be inside the image or the
#   container filesystem, so a leaked container layer cannot carry the keys.
services:
  api:
    build: .
    image: pdf2md-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Service-to-service, not host-to-service. `unlimited-ocr` is the service
      # name in ../unlimited-ocr-container/docker-compose.yml, and 8000 is the
      # port INSIDE that container -- the published 127.0.0.1:5000 mapping is for
      # host tooling only and is not reachable from here.
      #
      # Overrides whatever OCR_BASE_URL sits in .env: `environment` wins over
      # `env_file` in compose. Keep .env's value pointing at the host endpoint so
      # the Streamlit UI and ocr_client.py keep working outside Docker.
      OCR_BASE_URL: http://unlimited-ocr:8000
      TMPDIR: /tmp
    # Page renders at 300 DPI are large and short-lived; keeping them in RAM avoids
    # writing every upload to the container's writable layer.
    tmpfs:
      - /tmp:size=2g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - ocr-net
    # Nothing here waits for the OCR container: vLLM needs 10+ minutes to load
    # weights, and the API only calls OCR per request, so a slow neighbour costs a
    # failed request, not a failed boot.

# Created by ../unlimited-ocr-container/docker-compose.yml (`name: ocr-net`).
# `external: true` means compose attaches to it and never creates or removes it,
# so bring the OCR stack up first:
#
#   docker compose -f ../unlimited-ocr-container/docker-compose.yml up -d
#   docker compose up --build
networks:
  ocr-net:
    name: ocr-net
    external: true
